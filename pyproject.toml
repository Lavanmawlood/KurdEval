[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kurdeval"
version = "0.1.0"
description = "Kurdish LLM Evaluation Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lavan Mawlood"}]
keywords = ["kurdish", "llm", "evaluation", "nlp", "ai"]

dependencies = ["groq>=0.11.0", "google-genai>=0.3.0", "streamlit>=1.40.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "black>=24.0.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
